<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Stream Downloader</title>
    <link rel="stylesheet" href="../static/css/action.css">
    <link rel="stylesheet" href="../static/css/index.css">
    <link rel="stylesheet" href="../static/css/precentage.css">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <!-- 页面头部 -->
    <div class="header-container" id="main-header-container">
        <div class="header-container-start">
            <!-- Logo -->
            <div class="header-container-start-item">
                <div class="logo-container">
                    <img src="../static/media/logo.JPG" alt="Logo" class="logo-img">
                </div>
            </div>
        </div>
        <div class="header-container-end">
            <!-- 头像 -->
             <div class="header-container-end-item">
                <div class="avatar-container">
                    <img src="../static/media/avatar.png" alt="avatar" class="avatar">
                </div>
            </div>
        </div>
    </div>

    <!-- 主菜单切换复选框 -->
    <input type="checkbox" id="sidebar-toggle">
    
    <!-- 页面内容 -->
    <div class="content-container">
        <!-- 锚点目标，用于:target选择器 -->
        <div id="download"></div>
        <div id="history"></div>
        <div id="log"></div>
        <div id="setting"></div>

        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo-text">SMSD</div>
                <label for="sidebar-toggle" class="toggle-btn"></label>
            </div>

            <div class="sidebar-content">
                <div class="sidebar-menu">
                    <div class="sidebar-menu-item">
                        <!-- 下载框 -->
                        <a href="#download" class="sidebar-menu-link">
                            <span class="sidebar-menu-icon">⬇️</span>
                            <span class="sidebar-menu-text">Download</span>
                            <div class="tooltip">Download</div>
                        </a>
                    </div>

                    <div class="sidebar-menu-item">
                        <!-- 历史记录 -->
                        <a href="#history" class="sidebar-menu-link">
                            <span class="sidebar-menu-icon">🕒</span>
                            <span class="sidebar-menu-text">History</span>
                            <div class="tooltip">History</div>
                        </a>
                    </div>
                    <div class="sidebar-menu-item">
                        <!-- 下载日志 -->
                        <a href="#log" class="sidebar-menu-link">
                            <span class="sidebar-menu-icon">📝</span>
                            <span class="sidebar-menu-text">Log</span>
                            <div class="tooltip">Log</div>
                        </a>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-menu">
                    <div class="sidebar-menu-item">
                    <!-- 设置 -->
                        <a href="#setting" class="sidebar-menu-link">
                            <span class="sidebar-menu-icon">⚙️</span>
                            <span class="sidebar-menu-text">Settings</span>
                            <div class="tooltip">Settings</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主要内容 -->
        <div class="content-main">
            <section id="download-content" class="content-section">
                <!-- 下载框 -->
                <div id="wrapper">
                    <h1>Paste Your Link Here</h1>
                    <div class="container">
                        <textarea type="text" id="linkInput" class="auto-resize-input" placeholder="Enter your link here"></textarea>
                    </div>
                    <button id="submitButton">提交</button>
                    <button id="pasteButton" onclick="pasteFromClipboard()">从剪贴板读取</button>
                    
                    <!-- 加入喜好列表 -->
                    <div class="checkbox-container">
                        <label>
                            <input type="checkbox" id="favoriteCheckbox"> 添加到喜爱列表
                        </label>
                        <br>
                    </div>
                    <!-- 喜好程度 -->
                    <div class="slider-container" id="sliderContainer">
                        <div class="slider-wrapper">
                            <div class="slider-track">
                                <div class="slider-progress" id="sliderProgress"></div>
                            </div>
                            <input type="range" min="0" max="100" value="0" class="slider" id="preferenceSlider">
                        </div>
                        <span class="percentage" id="percentageValue">0%</span>
                    </div>
                    <p id="status" class="status">准备就绪</p>
                    
                    <!-- 当前下载状态 -->
                    <div class="download-status">
                        <p>当前下载: <span id="currentDownloads">0</span>/<span id="maxDownloads">-</span> (可用: <span id="availableSlots">-</span>)</p>
                    </div>
                    
                    <!-- 系统负载状态 -->
                    <div class="system-load-status">
                        <h4>系统负载:</h4>
                        <p>CPU: <span id="cpu-load-indicator" class="load-indicator normal">0%</span></p>
                        <p>内存: <span id="memory-load-indicator" class="load-indicator normal">0%</span></p>
                        <p>磁盘: <span id="disk-load-indicator" class="load-indicator normal">0%</span></p>
                        <p>网络: <span id="network-load-indicator" class="load-indicator normal">0 MB/s</span></p>
                    </div>
                </div>
            </section>
            <section id="history-content" class="content-section">
                <!-- 历史内容 -->
                <div class="history-container">
                    <h2>下载历史</h2>
                    <div class="history-controls">
                        <label for="historyFilter">筛选:</label>
                        <select id="historyFilter">
                            <option value="all">全部</option>
                            <option value="started">进行中</option>
                            <option value="completed">已完成</option>
                        </select>
                        
                        <label for="historyLimit">显示条数:</label>
                        <input type="number" id="historyLimit" value="20" min="1" max="100">
                        
                        <button id="refreshHistoryBtn">刷新历史</button>
                        <button id="clearHistoryBtn">清空历史</button>
                    </div>
                    <div id="historyList" class="history-list">
                        <p>点击"刷新历史"按钮加载下载历史...</p>
                    </div>
                </div>
            </section>
            <section id="log-content" class="content-section">
                <!-- 下载日志内容 -->
                <div class="log-container">
                    <h2>后台日志</h2>
                    <div class="log-controls">
                        <label for="logLevelSelect">日志级别:</label>
                        <select id="logLevelSelect">
                            <option value="ALL">全部</option>
                            <option value="DEBUG">调试</option>
                            <option value="INFO">信息</option>
                            <option value="WARNING">警告</option>
                            <option value="ERROR">错误</option>
                        </select>
                        
                        <label for="logLimitInput">显示条数:</label>
                        <input type="number" id="logLimitInput" value="50" min="1" max="1000">
                        
                        <button id="refreshLogsBtn">刷新日志</button>
                        <button id="clearLogsBtn">清空显示</button>
                    </div>
                    <div id="logOutput" class="log-output">
                        <p>点击"刷新日志"按钮加载后台日志...</p>
                    </div>
                </div>
            </section>
            <section id="setting-content" class="content-section">
                <!-- 设置内容 -->
                <p>Settings</p>
            </section>
        </div>

        <!-- 扩展栏 -->
        <div class="content-extra">
            <div class="extra-may-like"><p style="text-align:center">May Like</p></div>
        </div>
    </div>

    
    <!-- 页面底部 -->
    <div class="footer-container">
        <p id="copyright">© <span id="current-year">2025</span> Social Media Stream Downloader</p>
    </div>
    <script src="../static/js/auto_resize.js"></script>
    <script src="../static/js/clipboard.js"></script>
    <script src="../static/js/submit.js"></script>
    <script src="../static/js/favorite_scoring.js"></script>
    <script src="../static/js/dynamic_copyright.js"></script>
    <script src="../static/js/download_status.js"></script>
    <script src="../static/js/log_viewer.js"></script>
    <script src="../static/js/system_load_monitor.js"></script>
    <script src="../static/js/history_manager.js"></script>
</body>
</html>
