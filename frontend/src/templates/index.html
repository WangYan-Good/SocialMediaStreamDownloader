<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Parser</title>
    <style>
        .container {
            width: 100%;
            margin: 0 left;
        }
    
        .auto-resize-input {
            width: 100%; /* 输入框宽度固定为 100% */
            font-size: 16px; /* 字体大小 */
            padding: 10px; /* 内边距 */
            box-sizing: border-box; /* 确保 padding 不影响宽度 */
            border: 1px solid #ccc; /* 边框 */
            outline: none; /* 移除焦点边框 */
            resize: none; /* 禁用手动调整大小 */
            overflow: hidden; /* 隐藏滚动条 */
            line-height: 1.5; /* 行高 */
            white-space: pre-wrap; /* 自动换行 */
            word-wrap: break-word; /* 长单词换行 */
        }
    </style>
</head>
<body>
    <h1>Paste Your Link Here</h1>
    <div class="container">
        <textarea type="text" id="linkInput" class="auto-resize-input" placeholder="Enter your link here">
        </textarea>
    </div>
    <script>
        const input = document.getElementById('linkInput');
        const initialFontSize = 16; // 初始字体大小

        input.addEventListener('input', function () {
            // 重置高度，以便计算新的高度
            this.style.height = 'auto';
            // 设置高度为滚动高度（内容高度）
            this.style.height = this.scrollHeight + 'px';
          });

        // 初始化时触发一次 input 事件
        input.dispatchEvent(new Event('input'));
    </script>
    <button onclick="processLink()">Submit</button>
    <script>
        function processLink() {
            // 获取输入框中的链接
            const link = document.getElementById('linkInput').value;

            // 使用正则表达式解析链接
            const urlRegex = /https?:\/\/[^\s]+/g;
            const matches = link.match(urlRegex);

            if (matches && matches.length > 0) {
                // 如果有匹配的链接，发送到后端处理
                fetch('/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ urls: matches }),
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Success:', data);
                })
                .catch((error) => {
                    console.error('Error:', error);
                });
            } else {
                alert('No valid links found!');
            }
        }
    </script>
</body>
</html>
