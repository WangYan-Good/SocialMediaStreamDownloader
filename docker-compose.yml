version: '3.8'

services:
  social-media-downloader:
    build: .
    container_name: social-media-downloader
    ports:
      - "5000:5000"
    volumes:
      - ./downloads:/mnt/video  # 映射下载目录
      - ./logs:/app/logs       # 映射日志目录
      - ./config:/app/config   # 映射配置目录
    environment:
      - SAVE_PATH=/mnt/video
      - LOG_PATH=./logs
    restart: unless-stopped
    networks:
      - socialmedia-net

networks:
  socialmedia-net:
    driver: bridge