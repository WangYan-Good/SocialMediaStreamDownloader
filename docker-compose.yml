services:
  # ============================================
  # MySQL 数据库服务
  # ============================================
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: "${SMSD_DB_NAME:?run ./run-docker.sh}"
      MYSQL_USER: "${SMSD_DB_USER:?run ./run-docker.sh}"
      MYSQL_PASSWORD: "${SMSD_DB_PASSWORD:?run ./run-docker.sh}"
    secrets:
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/init-db:/docker-entrypoint-initdb.d
    networks:
      - smd-network
    command: >
      --max-connections=100
      --wait-timeout=28800
      --interactive-timeout=28800
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # 主应用服务
  # ============================================
  app:
    image: "${SMSD_IMAGE:-smsd:local}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SMSD_SERVER_PORT:?run ./run-docker.sh}:${SMSD_SERVER_PORT:?run ./run-docker.sh}"
    volumes:
      # 持久化下载视频
      - download_data:/app/downloads
      # 持久化日志
      - log_data:/app/logs
      # 唯一持久配置源；root 入口复制后立即降权运行应用
      - "${SMSD_CONFIG_FILE:?run ./run-docker.sh}:/run/secrets/config.yml:ro"
    networks:
      - smd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SMSD_SERVER_PORT:?run ./run-docker.sh}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

# ============================================
# 数据卷
# ============================================
volumes:
  mysql_data:
    driver: local
  download_data:
    driver: local
  log_data:
    driver: local

# ============================================
# 网络
# ============================================
networks:
  smd-network:
    driver: bridge

secrets:
  mysql_root_password:
    file: "${SMSD_MYSQL_ROOT_SECRET_FILE:?run ./run-docker.sh}"
