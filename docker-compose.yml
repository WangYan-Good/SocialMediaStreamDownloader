services:
  # ============================================
  # MySQL 数据库服务
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: smd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass}
      MYSQL_DATABASE: ${DB_NAME:-social_media_stream_downloader}
      MYSQL_USER: ${DB_USER:-smd_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-smd_secure_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/init-db:/docker-entrypoint-initdb.d
    networks:
      - smd-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # 主应用服务
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smd-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 数据库配置
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-social_media_stream_downloader}
      - DB_USER=${DB_USER:-smd_user}
      - DB_PASSWORD=${DB_PASSWORD:-smd_secure_pass}

      # 抖音配置
      - DOUYIN_COOKIE_SHARE_LIVE_URL=${DOUYIN_COOKIE_SHARE_LIVE_URL}
      - DOUYIN_COOKIE_LIVE_ROOM_INFO=${DOUYIN_COOKIE_LIVE_ROOM_INFO}
      - DOUYIN_COOKIE_POST_INFO=${DOUYIN_COOKIE_POST_INFO}
      - DOUYIN_MSTOKEN=${DOUYIN_MSTOKEN}

      # 下载配置
      - DOWNLOAD_SAVE_PATH=/app/downloads
      - DOWNLOAD_MAX_THREAD=${DOWNLOAD_MAX_THREAD:-0}

      # 服务器配置
      - SERVER_PORT=${SERVER_PORT:-5000}
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    volumes:
      # 持久化下载视频
      - download_data:/app/downloads
      # 持久化日志
      - ./logs:/app/logs
      # 挂载配置文件（可选，便于热更新）
      - ./.env:/app/.env:ro
    networks:
      - smd-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${SERVER_PORT:-5000}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

# ============================================
# 数据卷
# ============================================
volumes:
  mysql_data:
    driver: local
  download_data:
    driver: local

# ============================================
# 网络
# ============================================
networks:
  smd-network:
    driver: bridge
