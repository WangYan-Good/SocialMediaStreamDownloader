name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release artifact hygiene
        run: python scripts/check_release_artifact_hygiene.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # config/config.yml holds real credentials and is deliberately untracked.
      # A few service-level tests still exercise configuration-backed modern
      # task execution, so CI materialises the tracked safe example.
      # Materialised from the tracked example and hardened exactly the way
      # backend/src/unit_test/config_fixture.py hardens it, so CI runs against
      # the same settings the fixture already considers safe: no database, no
      # real transfers, no files written into the workspace.
      - name: Provide a test configuration
        run: |
          mkdir -p config
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
            Path("docs/design/config.yml.example").read_text(encoding="utf-8")
          )
          config["database"]["enable"] = False
          config["download"]["test_mode"] = True
          config["download"]["save_response"] = False
          config["download"]["save_error_response"] = False
          # Outside the workspace, so a stray write cannot masquerade as a
          # source file or reach the artefact upload.
          config["download"]["save_path"] = "/tmp/smsd-ci-downloads/"
          config["log"]["log_save"] = False
          config["server"]["debug_mode"] = False

          Path("config/config.yml").write_text(
            yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
            encoding="utf-8",
          )
          PY

      # The unit suite only. backend/src/integration_test talks to a real
      # database and is deliberately not part of this job.
      - name: Run unit tests
        run: python -m pytest backend/src/unit_test -q

      # A finished HLS recording is remuxed from MPEG-TS to MP4 so the library
      # can preview it. Whether a stream-copy into an MP4 container actually
      # works - including the AAC bitstream conversion the muxer inserts on its
      # own - is a fact about FFmpeg, and a stand-in process can only assert it.
      - name: Install ffmpeg for the real remux proof
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      # SMSD_REQUIRE_FFMPEG_TESTS is the point of this step, for the same reason
      # SMSD_REQUIRE_MYSQL_TESTS is the point of the MySQL one: without it, an
      # ffmpeg that went missing would answer with a green job full of skips.
      - name: Run the real ffmpeg remux tests
        env:
          SMSD_REQUIRE_FFMPEG_TESTS: '1'
        run: |
          set -euo pipefail
          python -m pytest \
            backend/src/unit_test/test_hls_mp4_normalizer_ffmpeg.py \
            -q -rs --no-header > /tmp/ffmpeg-tests.txt 2>&1 || {
              cat /tmp/ffmpeg-tests.txt
              exit 1
            }
          cat /tmp/ffmpeg-tests.txt
          if grep -qE '[0-9]+ skipped' /tmp/ffmpeg-tests.txt; then
            echo "FAIL: the real remux tests skipped - they must actually run here"
            exit 1
          fi
          grep -qE '[0-9]+ passed' /tmp/ffmpeg-tests.txt || {
            echo "FAIL: no tests ran"
            exit 1
          }

  # The schema proof, kept apart from the unit job on purpose.
  #
  # Everything this exercises is MySQL-specific and cannot be checked any other
  # way: generated columns and their unique constraints, real foreign-key
  # actions, auto-increment identities, and upgrade/downgrade behaviour. A fake
  # cursor cannot disagree with invalid DDL and SQLite would enforce different
  # rules, so neither is evidence.
  #
  # Separate rather than folded into `backend` so the ordinary unit suite stays
  # offline and fast: nobody should need a database to run it, and it still
  # holds the constraint's *shape* through source-level tests.
  mysql:
    name: MySQL schema and migrations
    runs-on: ubuntu-latest
    # Reads the checkout and nothing else.
    permissions:
      contents: read
    services:
      mysql:
        # The version docker-compose already pins. Not `latest`, and not
        # MariaDB: the collation this schema uses is 8.0-only, and the
        # generated-column behaviour being proved is MySQL's.
        image: mysql:8.0
        env:
          # Test-only, and only ever reachable from this job's own service
          # container. Nothing here is a repository secret and nothing here
          # touches a real database.
          MYSQL_ROOT_PASSWORD: smsd_test
          MYSQL_DATABASE: smsd_test
        ports:
          - 3306:3306
        # The tests create and drop their own disposable databases, so the job
        # must not start until the server genuinely answers. A fixed sleep is
        # the usual way this becomes flaky on a slow runner.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psmsd_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No config/config.yml is materialised here, and none is needed: these
      # tests build their connection from the DSN below rather than from the
      # loaded configuration.
      #
      # SMSD_REQUIRE_MYSQL_TESTS is the point of this step. Without it a missing
      # or unusable database would answer with a green job full of skips - a
      # proof that quietly stopped happening, which is exactly the failure this
      # job exists to prevent. With it, that is a hard failure.
      - name: Run the MySQL schema and migration tests
        env:
          SMSD_TEST_MYSQL_DSN: mysql+pymysql://root:smsd_test@127.0.0.1:3306
          SMSD_REQUIRE_MYSQL_TESTS: '1'
        run: |
          python -m pytest \
            backend/src/unit_test/test_person_main_constraint_mysql.py \
            backend/src/unit_test/test_auth_migration_mysql.py \
            backend/src/unit_test/test_post_ownership_migration_mysql.py \
            backend/src/unit_test/test_recording_resource_migration_mysql.py \
            backend/src/unit_test/test_rbac_role_migration_mysql.py \
            backend/src/unit_test/test_recording_recovery_key_migration_mysql.py \
            backend/src/unit_test/test_recording_recovery_handoff_mysql.py \
            backend/src/unit_test/test_recording_recovery_reconciliation_mysql.py \
            -q -rs

      # Belt and braces. The flag above already turns a missing DSN into a
      # collection error, but a future edit could reintroduce a skip some other
      # way - a decorator, a marker, an environment check - and a skipped proof
      # reads exactly like a passing one in the summary.
      - name: Refuse a run that skipped anything
        env:
          SMSD_TEST_MYSQL_DSN: mysql+pymysql://root:smsd_test@127.0.0.1:3306
          SMSD_REQUIRE_MYSQL_TESTS: '1'
        run: |
          set -euo pipefail
          python -m pytest \
            backend/src/unit_test/test_person_main_constraint_mysql.py \
            backend/src/unit_test/test_auth_migration_mysql.py \
            backend/src/unit_test/test_post_ownership_migration_mysql.py \
            backend/src/unit_test/test_recording_resource_migration_mysql.py \
            backend/src/unit_test/test_rbac_role_migration_mysql.py \
            backend/src/unit_test/test_recording_recovery_key_migration_mysql.py \
            backend/src/unit_test/test_recording_recovery_handoff_mysql.py \
            backend/src/unit_test/test_recording_recovery_reconciliation_mysql.py \
            -q -rs --no-header > /tmp/mysql-tests.txt 2>&1 || {
              cat /tmp/mysql-tests.txt
              exit 1
            }
          cat /tmp/mysql-tests.txt
          if grep -qE '[0-9]+ skipped' /tmp/mysql-tests.txt; then
            echo "FAIL: the MySQL schema tests skipped - they must actually run here"
            exit 1
          fi
          grep -qE '[0-9]+ passed' /tmp/mysql-tests.txt || {
            echo "FAIL: no tests ran"
            exit 1
          }

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4

      # Node 24, matching frontend/app/package.json engines and the Dockerfile
      # builder stage. One major across all three, so a lockfile resolved in one
      # place installs the same way in the others.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      # npm ci, never npm install: the lockfile is the contract, and resolving
      # versions afresh in CI is how a green build stops matching the one that
      # ships.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  image:
    name: Docker build and runtime smoke
    runs-on: ubuntu-latest
    # Only once both halves pass: the image contains both, so building it before
    # either is verified would only ever fail slower.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t smsd:ci .

      - name: Release image artifact hygiene
        run: |
          docker run --rm --entrypoint python smsd:ci \
            /app/scripts/check_release_artifact_hygiene.py --image-root /app

      # A build that passes proves the image assembles, and nothing about
      # whether it starts. It did not, for a while: the entrypoint validates the
      # mounted configuration against docs/design/config.yml.example before
      # staging it, and .dockerignore excluded docs/ - so every build was green
      # and every container exited immediately. Only running it finds that.
      - name: Generate a safe smoke configuration
        run: |
          mkdir -p /tmp/smsd-smoke
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
            Path("docs/design/config.yml.example").read_text(encoding="utf-8")
          )
          # No database, no real transfers, nothing written into the workspace.
          # The smoke proves the image starts and serves; it must never need a
          # credential, a database or the platform.
          config["database"]["enable"] = False
          config["download"]["test_mode"] = True
          config["download"]["save_response"] = False
          config["download"]["save_error_response"] = False
          config["download"]["save_path"] = "/tmp/smsd-smoke-downloads/"
          config["log"]["log_save"] = False
          config["server"]["debug_mode"] = False
          config["server"]["host"] = "127.0.0.1"

          Path("/tmp/smsd-smoke/config.yml").write_text(
            yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
            encoding="utf-8",
          )
          PY

      - name: Runtime smoke
        run: |
          set -euo pipefail

          # Logs on the way out, whatever happened, and always remove the
          # container - a failed smoke must not leave one behind or wedge the
          # job.
          cleanup() {
            echo "::group::container logs"
            docker logs smsd-ci-smoke 2>&1 || true
            docker logs smsd-ci-sigterm 2>&1 || true
            echo "::endgroup::"
            docker rm -f smsd-ci-smoke >/dev/null 2>&1 || true
            docker rm -f smsd-ci-sigterm >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Docker picks the host port. A fixed one collides with whatever else
          # a runner happens to be holding.
          docker run -d --name smsd-ci-smoke \
            -p 127.0.0.1::5000 \
            -v /tmp/smsd-smoke/config.yml:/run/secrets/config.yml:ro \
            smsd:ci

          PORT="$(docker port smsd-ci-smoke 5000/tcp | head -1 | sed 's/.*://')"
          BASE="http://127.0.0.1:${PORT}"
          echo "smoke base: ${BASE}"

          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/" || true)" = "200" ]; then
              echo "ready after ${attempt}s"
              break
            fi
            if [ "${attempt}" = "60" ]; then
              echo "container never became ready"
              exit 1
            fi
            sleep 1
          done

          expect() {
            code="$(curl -s -o /dev/null -w '%{http_code}' "${BASE}$1")"
            if [ "${code}" != "$2" ]; then
              echo "FAIL $1 -> ${code}, expected $2"
              exit 1
            fi
            echo "ok   $1 -> ${code}"
          }

          expect_redirect() {
            path="$1"
            target="$2"
            headers="/tmp/smsd-smoke/redirect-headers.txt"
            code="$(curl -s -o /dev/null -D "${headers}" -w '%{http_code}' "${BASE}${path}")"
            location="$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "${headers}")"
            if [ "${code}" != "302" ] || [ "${location}" != "${target}" ]; then
              echo "FAIL ${path} -> ${code} Location=${location}, expected 302 ${target}"
              exit 1
            fi
            echo "ok   ${path} -> 302 ${location}"
          }

          expect_not_vue() {
            path="$1"
            expect "${path}" 404
            if curl -s "${BASE}${path}" | grep -q '<div id="app">'; then
              echo "FAIL ${path} was swallowed by the Vue shell"
              exit 1
            fi
          }

          # Vue owns root, and the emitted document must agree with the Flask
          # root asset mount rather than carrying the retired /app/ base.
          expect / 200
          curl -fsS "${BASE}/" > /tmp/smsd-smoke/root.html
          curl -fsS -D /tmp/smsd-smoke/server-headers.txt \
            -o /dev/null "${BASE}/"
          grep -qiE '^server: waitress([[:space:]]|$)' \
            /tmp/smsd-smoke/server-headers.txt || {
              echo "FAIL: production response was not served by Waitress"
              cat /tmp/smsd-smoke/server-headers.txt
              exit 1
            }

          # Exercise the image's real foreground process and the project's
          # signal choreography. Unit tests prove both cleanup callbacks are
          # exactly-once; this proves a production Waitress process accepts
          # SIGTERM and exits promptly instead of hanging in its thread pool.
          docker run -d --name smsd-ci-sigterm \
            -v /tmp/smsd-smoke/config.yml:/run/secrets/config.yml:ro \
            smsd:ci
          for attempt in $(seq 1 60); do
            if docker exec smsd-ci-sigterm \
              curl -fsS http://127.0.0.1:5000/ >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = "60" ]; then
              echo "FAIL: SIGTERM probe server never became ready"
              exit 1
            fi
            sleep 1
          done
          docker kill --signal=TERM smsd-ci-sigterm >/dev/null
          SIGNAL_STATUS="$(docker wait smsd-ci-sigterm)"
          test "${SIGNAL_STATUS}" = "143" || {
            echo "FAIL: Waitress SIGTERM exit=${SIGNAL_STATUS}, expected 143"
            exit 1
          }
          echo "ok   runtime production WSGI server profile" \
            > /tmp/production-wsgi-smoke.txt
          cat /tmp/production-wsgi-smoke.txt
          grep -q 'ok   runtime production WSGI server profile' \
            /tmp/production-wsgi-smoke.txt || {
              echo "FAIL: production WSGI runtime marker was absent"
              exit 1
            }

          # Phase 13D: exercise the real four-thread Waitress scheduling model
          # around the production login blueprint. Two expensive authentication
          # calls occupy two slots, the third is an immediate 429, and a fourth
          # Waitress worker remains available for unrelated traffic. The fake
          # service is deliberately network/database-free; the concurrency and
          # HTTP boundaries are the runtime facts under test.
          cat > /tmp/login-abuse-smoke.py <<'PY'
          import http.client
          import json
          import sys
          import threading
          import time

          sys.path.insert(0, "/app")
          from flask import Flask, jsonify
          from waitress import create_server
          from backend.src.auth.login_abuse import LoginAbuseGuard
          from backend.src.auth.service import AuthenticatedUser, IssuedSession
          from backend.src.web.auth_routes import build_auth_blueprint

          class _Service:
            def __init__(self):
              self.calls = []
              self.entered = threading.Barrier(3)
              self.release = threading.Event()

            def authenticate(self, username, password):
              self.calls.append(username)
              if len(self.calls) <= 2:
                self.entered.wait(timeout=10)
                self.release.wait(timeout=10)
              return AuthenticatedUser(1, username, "user")

            def create_session(self, user_id):
              return IssuedSession("runtime-opaque-session", None)

            def resolve_session(self, token):
              return None

          class _Runtime:
            def __init__(self, service):
              self._service = service

            def service(self):
              return self._service

            def cookie_secure(self):
              return False

            def session_ttl_seconds(self):
              return 60

          service = _Service()
          guard = LoginAbuseGuard()
          app = Flask(__name__)
          app.register_blueprint(
            build_auth_blueprint(runtime=_Runtime(service), abuse_guard=guard)
          )

          @app.get("/harmless")
          def harmless():
            return jsonify({"status": "success"})

          server = create_server(
            app,
            host="127.0.0.1",
            port=0,
            threads=4,
            expose_tracebacks=False,
          )
          serving = threading.Thread(target=server.run, daemon=True)
          serving.start()
          port = server.effective_port

          def request(path, *, username=None, forwarded=None):
            connection = http.client.HTTPConnection("127.0.0.1", port, timeout=10)
            headers = {}
            body = None
            method = "GET"
            if username is not None:
              method = "POST"
              body = json.dumps({
                "username": username,
                "password": "correct horse battery",
              })
              headers["Content-Type"] = "application/json"
            if forwarded is not None:
              headers["X-Forwarded-For"] = forwarded
            connection.request(method, path, body=body, headers=headers)
            response = connection.getresponse()
            payload = response.read()
            result = (response.status, dict(response.getheaders()), payload)
            connection.close()
            return result

          for readiness_attempt in range(100):
            try:
              if request("/harmless")[0] == 200:
                break
            except OSError:
              pass
            time.sleep(0.05)
          else:
            raise SystemExit("FAIL: Waitress login proof server never became ready")

          responses = []

          def blocked(username):
            responses.append(request("/api/auth/login", username=username))

          first = threading.Thread(target=blocked, args=("runtime-first",))
          second = threading.Thread(target=blocked, args=("runtime-second",))
          first.start()
          second.start()
          service.entered.wait(timeout=10)

          third_status, third_headers, third_body = request(
            "/api/auth/login", username="runtime-third"
          )
          harmless_status, _, _ = request("/harmless")
          if third_status != 429 or harmless_status != 200:
            raise SystemExit(
              "FAIL: saturated login status=%s harmless=%s"
              % (third_status, harmless_status)
            )
          if len(service.calls) != 2:
            raise SystemExit("FAIL: third request entered expensive auth")
          if int(third_headers.get("Retry-After", "0")) < 1:
            raise SystemExit("FAIL: 429 omitted positive Retry-After")
          if "Set-Cookie" in third_headers:
            raise SystemExit("FAIL: 429 created an authentication cookie")
          refused = json.loads(third_body)
          if refused.get("kind") != "rate_limited" or "reason" in refused:
            raise SystemExit("FAIL: 429 exposed the wrong contract")

          service.release.set()
          first.join(timeout=10)
          second.join(timeout=10)
          if first.is_alive() or second.is_alive():
            raise SystemExit("FAIL: admitted authentication did not finish")
          if sorted(item[0] for item in responses) != [200, 200]:
            raise SystemExit("FAIL: admitted authentication response failed")
          if guard.inflight != 0:
            raise SystemExit("FAIL: authentication slots leaked after release")

          next_status, _, _ = request(
            "/api/auth/login", username="runtime-next"
          )
          if next_status != 200:
            raise SystemExit("FAIL: legitimate login could not enter after release")

          # A total of twenty attempts now share the one socket peer even
          # though every request claims a different forwarding address.
          for index in range(16):
            status, _, _ = request(
              "/api/auth/login",
              username="xff-%d" % index,
              forwarded="203.0.113.%d" % index,
            )
            if status != 200:
              raise SystemExit("FAIL: XFF setup attempt %d -> %s" % (index, status))
          spoofed_status, _, _ = request(
            "/api/auth/login",
            username="xff-overflow",
            forwarded="198.51.100.250",
          )
          if spoofed_status != 429:
            raise SystemExit("FAIL: spoofed XFF bypassed transport peer bound")

          server.close()
          print("ok   runtime bounded login abuse resistance")
          PY
          docker cp /tmp/login-abuse-smoke.py \
            smsd-ci-smoke:/tmp/login-abuse-smoke.py
          docker exec smsd-ci-smoke python /tmp/login-abuse-smoke.py \
            > /tmp/login-abuse-smoke.txt 2>&1 || {
              cat /tmp/login-abuse-smoke.txt
              echo "FAIL: bounded login abuse runtime proof did not complete"
              exit 1
            }
          cat /tmp/login-abuse-smoke.txt
          grep -Fxq 'ok   runtime bounded login abuse resistance' \
            /tmp/login-abuse-smoke.txt || {
              echo "FAIL: bounded login abuse runtime marker was absent"
              exit 1
            }

          # Phase 13A-B: exercise the actual live-info diagnostic method with
          # fake responses. Network is deliberately absent; the boundary under
          # test is what the debug path emits when transport material is rich
          # in credentials.
          cat > /tmp/sensitive-diagnostic-smoke.py <<'PY'
          import contextlib
          import io
          import logging
          import sys
          from pathlib import Path

          import yaml

          sys.path.insert(0, "/app")
          from backend.src.library.baselib import get_dict_attr
          from backend.src.platform.douyin import douyin_live_prober as module
          from backend.src.platform.douyin import douyin_listener as listener_module
          from backend.src.service import live_recording_task as task_module
          from backend.src.platform.douyin.douyin_listener import ListenerItem
          from backend.src.service.live_recording_task import LiveRecordingTaskService

          secrets = (
            "SECRET_COOKIE_13A",
            "SECRET_AUTHORIZATION_13A",
            "SECRET_MSTOKEN_13A",
            "SECRET_X_BOGUS_13A",
            "SECRET_VERIFY_FP_13A",
            "SECRET_SIGN_13A",
            "SECRET_QUERY_TOKEN_13A",
            "SECRET_PROXY_PASSWORD_13A",
            "SECRET_SESSION_13A",
            "SECRET_CSRF_13A",
          )
          config = yaml.safe_load(Path(
            "/app/docs/design/config.yml.example"
          ).read_text(encoding="utf-8"))
          config["server"]["debug_mode"] = True
          config["download"]["user_login"] = True
          config["database"]["password"] = secrets[7]

          class _Config:
            def get_config_dict_attr(self, path):
              return get_dict_attr(config, path)

          class _Api:
            def get_config_dict_attr(self, path):
              return (
                "https://webcast.amemv.com/webcast/room/reflow/info/"
                "?sign=" + secrets[5]
              )

          class _Response:
            status_code = 200

          class _Context:
            config = _Config()
            API = _Api()

            def query_url(self, **unused):
              return _Response()

          log_output = io.StringIO()
          logger = logging.Logger("phase13a-runtime-diagnostic")
          logger.propagate = False
          logger.addHandler(logging.StreamHandler(log_output))
          module.get_logger = lambda: logger
          task_module.get_logger = lambda: logger
          listener_module.get_logger = lambda: logger
          params = {
            "msToken": secrets[2],
            "X-Bogus": secrets[3],
            "verifyFp": secrets[4],
            "sign": secrets[5],
            "token": secrets[6],
          }
          headers = {
            "Cookie": secrets[0],
            "Authorization": secrets[1],
            "X-Session": secrets[8],
            "X-CSRF-Token": secrets[9],
          }
          stdout = io.StringIO()
          stderr = io.StringIO()
          with contextlib.redirect_stdout(stdout), contextlib.redirect_stderr(stderr):
            module.DouyinLiveProber(_Context())._request_live_info(
              params, headers
            )

            class _FailingDownloader:
              def run_with_result(self, unused_token):
                raise RuntimeError("signed-exception=" + secrets[6])

            service = LiveRecordingTaskService(
              downloader_factory=lambda: _FailingDownloader(),
            )
            item = ListenerItem(
              func=lambda: service._run(
                None,
                {"url": "https://live.example.test/room?token=" + secrets[6]},
              ),
              args=(),
            )
            item.start_item()
            item._thread.join(timeout=5)
            if item._thread.is_alive():
              raise SystemExit("FAIL: diagnostic failure thread did not exit")

          visible = stdout.getvalue() + stderr.getvalue() + log_output.getvalue()
          leaked = [secret for secret in secrets if secret in visible]
          if leaked:
            raise SystemExit("FAIL: sensitive diagnostic leaked sentinels")
          if "live diagnostic event=live_info_request" not in visible:
            raise SystemExit("FAIL: safe live diagnostic event was absent")
          if "host=webcast.amemv.com" not in visible:
            raise SystemExit("FAIL: safe diagnostic host was absent")
          if "live diagnostic event=live_recording_failed" not in visible:
            raise SystemExit("FAIL: safe failure diagnostic event was absent")
          print("ok   runtime sensitive diagnostic logging redaction")
          PY
          docker cp /tmp/sensitive-diagnostic-smoke.py \
            smsd-ci-smoke:/tmp/sensitive-diagnostic-smoke.py
          docker exec smsd-ci-smoke \
            python /tmp/sensitive-diagnostic-smoke.py \
            > /tmp/sensitive-diagnostic-smoke.txt 2>&1 || {
              cat /tmp/sensitive-diagnostic-smoke.txt
              echo "FAIL: sensitive diagnostic runtime proof failed"
              exit 1
            }
          cat /tmp/sensitive-diagnostic-smoke.txt
          grep -q 'ok   runtime sensitive diagnostic logging redaction' \
            /tmp/sensitive-diagnostic-smoke.txt || {
              echo "FAIL: sensitive diagnostic runtime marker was absent"
              exit 1
            }
          grep -q '<div id="app">' /tmp/smsd-smoke/root.html \
            || { echo "FAIL / is not the Vue shell"; exit 1; }
          if grep -q 'sidebar-menu-text\|/app/assets/' /tmp/smsd-smoke/root.html; then
            echo "FAIL / contains Legacy markup or the old asset base"
            exit 1
          fi

          # Every deep link returns the shell, so a refresh inside the
          # application does not 404.
          #
          # Both consoles, and the legacy paths still promised. The admin ones
          # matter for the same reason as the rest and were the ones missing:
          # Flask has never heard of any of these, so a prefix accidentally
          # becoming reserved - or the catch-all being narrowed - would 404 a
          # refresh in production while every unit test stayed green.
          #
          # /admin is in this list, not in the redirect list below it. It
          # redirects to /admin/creators in the *router*, once the shell has
          # loaded; Flask must answer it with the shell like any other
          # client-side route.
          for path in new library tasks login forbidden auth-unavailable \
                      admin admin/creators admin/library admin/tasks admin/system \
                      overview creators system; do
            expect "/${path}" 200
            curl -s "${BASE}/${path}" | grep -q '<div id="app">' \
              || { echo "FAIL /${path} is not the Vue shell"; exit 1; }
          done

          # Fetch a real emitted script. Root html alone can be healthy while
          # its base or Flask asset mount is broken.
          ASSET_PATH="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/smsd-smoke/root.html | head -1 | cut -d '"' -f 2)"
          test -n "${ASSET_PATH}" || { echo "FAIL no root JS asset found"; exit 1; }
          curl -fsS -D /tmp/smsd-smoke/asset-headers.txt \
            -o /tmp/smsd-smoke/app.js "${BASE}${ASSET_PATH}"
          grep -qiE '^content-type: (application|text)/javascript' /tmp/smsd-smoke/asset-headers.txt \
            || { echo "FAIL ${ASSET_PATH} is not JavaScript"; exit 1; }

          # P16 retires the public Legacy surface. These namespaces remain
          # tombstones so removing their old Flask routes cannot make the Vue
          # catch-all claim them.
          for path in /legacy /legacy/ /legacy/definitely-does-not-exist \
                      /static /static/ /static/js/submit.js \
                      /static/definitely-does-not-exist.css; do
            expect_not_vue "${path}"
          done

          # The old raw-url dispatcher trust boundary is gone. Flask naturally
          # reports method-not-allowed; there is no redirect/replacement route.
          code="$(curl -s -o /tmp/smsd-smoke/post.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{}' "${BASE}/")"
          test "${code}" = "405" || { echo "FAIL POST / -> ${code}, expected 405"; exit 1; }

          # Production retirement is an image property, not just a source-tree
          # grep. The runtime image must not contain the deleted Legacy UI or
          # its dispatcher modules.
          docker exec smsd-ci-smoke test ! -d /app/frontend/src
          docker exec smsd-ci-smoke test ! -e /app/backend/src/platform/platform_dispatcher.py
          docker exec smsd-ci-smoke test ! -e /app/backend/src/platform/douyin/douyin_handler.py
          docker exec smsd-ci-smoke test ! -e /app/backend/src/platform/other/other_handler.py

          # Old bookmarks remain reversible temporary redirects. Query text is
          # preserved, and doubled slashes cannot create an external Location.
          expect_redirect /app /
          expect_redirect /app/ /
          expect_redirect /app/tasks /tasks
          expect_redirect '/app/tasks?state=running' '/tasks?state=running'
          expect_redirect "/app${ASSET_PATH}" "${ASSET_PATH}"
          expect_redirect /app//evil.example/path /evil.example/path

          # A missing asset must 404 rather than fall back to index.html -
          # otherwise a broken bundle reference silently returns html and the
          # failure surfaces as a syntax error in the browser.
          expect /assets/definitely-does-not-exist.js 404

          expect_not_vue /api/definitely-does-not-exist
          expect "/api/auth/me" 401
          expect "/api/tasks?limit=1" 401
          expect "/api/system/status" 401

          # Media delivery is not a public file server. These are the only
          # endpoints in the application that return bytes from disk, so the
          # image itself has to prove they refuse an anonymous caller - a unit
          # test cannot notice a reverse proxy or a route ordering that let one
          # through in the built artifact.
          #
          # 401 rather than 404: the refusal happens at authentication, before
          # any lookup, so the answer cannot depend on whether the resource or
          # the file exists.
          expect "/api/library/posts/douyin/7657271784144009946/assets/$(printf 'a%.0s' $(seq 64))/download" 401
          expect "/api/library/recordings/7/assets/$(printf 'a%.0s' $(seq 64))/download" 401

          # And the metadata endpoints beside them, for the same reason.
          expect "/api/library/posts/douyin/7657271784144009946/assets" 401
          expect "/api/library/recordings/7/assets" 401

          # A Range header must not be a way around authentication. Phase 10C
          # added byte ranges to these same endpoints, and the refusal has to
          # happen before anything looks at a file - so a ranged request from
          # an anonymous caller answers exactly as an unranged one does.
          #
          # Serving an actual partial response here would mean seeding a user,
          # a row and a media fixture inside the smoke container; that is
          # covered by the route-level integration tests instead. What only the
          # built image can prove is that the header does not change who may
          # ask.
          expect_ranged() {
            code="$(curl -s -o /dev/null -H 'Range: bytes=0-3' \
              -w '%{http_code}' "${BASE}$1")"
            if [ "${code}" != "$2" ]; then
              echo "FAIL ranged $1 -> ${code}, expected $2"
              exit 1
            fi
            echo "ok   ranged $1 -> ${code}"
          }
          expect_ranged "/api/library/posts/douyin/7657271784144009946/assets/$(printf 'a%.0s' $(seq 64))/download" 401
          expect_ranged "/api/library/recordings/7/assets/$(printf 'a%.0s' $(seq 64))/download" 401

          # Phase 10D serves the same bytes inline for a closed list of media
          # types. Inline delivery is the response a page renders rather than
          # saves, so the built image has to prove it is not a public media
          # server either - anonymously, and with a Range header, which is how
          # a <video> element actually asks.
          expect "/api/library/posts/douyin/7657271784144009946/assets/$(printf 'a%.0s' $(seq 64))/preview" 401
          expect "/api/library/recordings/7/assets/$(printf 'a%.0s' $(seq 64))/preview" 401
          expect_ranged "/api/library/posts/douyin/7657271784144009946/assets/$(printf 'a%.0s' $(seq 64))/preview" 401
          expect_ranged "/api/library/recordings/7/assets/$(printf 'a%.0s' $(seq 64))/preview" 401

          # The media asset endpoints read the server's own filesystem, so the
          # first thing worth proving about them is that nobody unauthenticated
          # can reach one. No real volume file is involved: an anonymous request
          # is refused before any path is resolved.
          expect "/api/library/posts/douyin/test/assets" 401
          expect "/api/library/recordings/1/assets" 401

          # Phase 10F remuxes a finished HLS recording from MPEG-TS to MP4 so
          # the library can preview it natively. That runs inside this image,
          # using this image's ffmpeg - so the image is what has to prove it
          # can. A one-second clip generated in the container: nothing is
          # downloaded and no fixture is committed.
          #
          # Staged as a file and run by path rather than piped to `python -`.
          # `docker exec` does not attach stdin without `-i`, so a piped
          # heredoc reaches an immediate EOF: python exits 0 having run
          # nothing, and the smoke passes without testing anything at all.
          cat > /tmp/remux-smoke.py <<'PY'
          import multiprocessing
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "/app")
          from backend.src.platform.douyin.hls_mp4_normalizer import HlsMp4Normalizer
          from backend.src.platform.douyin.hls_recorder import HlsRecorder

          ffmpeg = shutil.which("ffmpeg")
          ffprobe = shutil.which("ffprobe")
          if not ffmpeg or not ffprobe:
            raise SystemExit("FAIL: the runtime image has no ffmpeg/ffprobe")

          # A set, not a string: MPEG-TS lists a stream under each program as
          # well as in the flat stream list, so the .ts reports a codec more
          # than once and the .mp4 exactly once. Which codec is there is the
          # question; how often it is mentioned is not.
          def codecs(path, stream):
            out = subprocess.run(
              [ffprobe, "-v", "error", "-select_streams", stream,
               "-show_entries", "stream=codec_name",
               "-of", "default=noprint_wrappers=1:nokey=1", str(path)],
              capture_output=True, text=True, timeout=60,
            ).stdout
            return {line.strip() for line in out.splitlines() if line.strip()}

          with tempfile.TemporaryDirectory() as directory:
            source = Path(directory) / "live.ts"
            built = subprocess.run(
              [ffmpeg, "-nostdin", "-hide_banner", "-loglevel", "error", "-y",
               "-f", "lavfi", "-i", "testsrc=size=64x48:rate=10:duration=1",
               "-f", "lavfi", "-i", "sine=frequency=440:duration=1",
               "-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p",
               "-c:a", "aac", "-shortest", "-f", "mpegts", str(source)],
              capture_output=True, text=True, timeout=180,
            )
            if built.returncode != 0 or not source.stat().st_size:
              raise SystemExit(
                "FAIL: could not build a TS fixture: " + built.stderr[:400]
              )

            # Phase 10G: the durability primitives have to work on *this*
            # filesystem, not just in a unit test. A directory file descriptor
            # is the part most likely to be unavailable on an exotic overlay,
            # and publication fails closed if it is - so prove it here.
            normalizer = HlsMp4Normalizer()
            normalizer._sync_file(source)
            normalizer._sync_directory(source.parent)
            print("ok   runtime file+directory fsync")

            # Phase 10H: capture finalization has its own durability sequence -
            # attempt fsync, pre-rename directory fsync, replace, final
            # directory fsync - and it must work on this image's filesystem
            # too. No ffmpeg needed: this is pure filesystem behaviour.
            attempt = Path(directory) / ".probe.ts.attempt-1.part"
            attempt.write_bytes(b"captured-media-bytes")
            reserved = Path(directory) / "probe.ts"
            reserved.touch()
            finalized = HlsRecorder()._finalize_successful_attempt(
              attempt, reserved
            )
            if finalized != reserved or not reserved.is_file():
              raise SystemExit("FAIL: capture finalization did not publish")
            if reserved.read_bytes() != b"captured-media-bytes":
              raise SystemExit("FAIL: finalized capture bytes differ")
            if attempt.exists():
              raise SystemExit("FAIL: the attempt survived finalization")
            reserved.unlink()
            print("ok   runtime HLS capture durability finalization")

            # Phase 13A-C: the production HTTP fetch path, with only the
            # transport replaced. File write/flush, file fsync, close,
            # directory open/fsync/close all execute against this container's
            # real filesystem.
            from backend.src.base import file_fetcher as _file_fetcher

            class _FlvResponse:
              status_code = 200
              headers = {"Content-Length": "22"}

              def raise_for_status(self):
                return None

              def iter_content(self, chunk_size=None):
                return iter((b"durable-flv-like-bytes",))

              def close(self):
                return None

            original_request = _file_fetcher.request
            _file_fetcher.request = lambda **unused: _FlvResponse()
            try:
              flv_target = _file_fetcher.fetch_file(
                "https://cdn.example.test/live.flv",
                Path(directory),
                "live.flv",
                durable_success=True,
              )
            finally:
              _file_fetcher.request = original_request
            if flv_target.read_bytes() != b"durable-flv-like-bytes":
              raise SystemExit("FAIL: durable FLV bytes differ")
            print("ok   runtime FLV capture durability finalization")

            # Phase 11B: a recovery note is published to the same persistent
            # storage as the media, so the image's filesystem has to support
            # the whole protocol - hidden directory, exclusive temp, fsync,
            # no-clobber link, read back, retire. No ffmpeg and no database
            # involved: this is purely filesystem behaviour.
            from datetime import datetime as _dt
            from backend.src.service.recording_recovery_journal import (
              RecordingRecoveryJournal,
            )
            from backend.src.service.recording_resource import (
              RecordingPersistenceIntent,
            )

            journal_root = Path(directory) / "journal-probe"
            journal_root.mkdir()
            journal = RecordingRecoveryJournal(
              config_loader=lambda: {
                "download": {"save_path": str(journal_root)}
              }
            )
            probe_key = "0123456789abcdef0123456789abcdef"
            probe_intent = RecordingPersistenceIntent(
              app_user_id=41,
              platform="douyin",
              room_id="998877",
              owner_user_id="owner-1",
              title="runtime probe",
              protocol="hls",
              # Root-relative: a note may only describe media inside the
              # configured storage root, and this probe uses a temporary one.
              output_path="douyin/live/A/live.mp4",
              started_at=_dt(2026, 8, 30, 9, 0, 0),
              finished_at=_dt(2026, 8, 30, 10, 0, 0),
              source="task_api",
            )
            note = journal.publish(probe_intent, probe_key)
            if not note.is_file():
              raise SystemExit("FAIL: recovery journal note was not published")
            if journal.load(probe_key) != probe_intent:
              raise SystemExit("FAIL: recovery journal did not round-trip")
            leftovers = [
              p.name for p in note.parent.iterdir() if ".part" in p.name
            ]
            if leftovers:
              raise SystemExit(
                "FAIL: recovery journal temporaries left behind: %s" % leftovers
              )
            journal.acknowledge(probe_key)
            if note.exists() or journal.load(probe_key) is not None:
              raise SystemExit("FAIL: recovery journal note was not retired")
            print("ok   runtime recording recovery journal durability")

            # Phase 11C: those notes are now consumed automatically when the
            # application starts. What only the built image can prove is that
            # the primitives the scan and the media gate are built from work on
            # this kernel and this filesystem - directory file descriptors,
            # scandir over one, O_NOFOLLOW, and the descriptor walk the media
            # boundary performs. Every one of them fails closed, so a host that
            # cannot do them would recover nothing and say so only in a log.
            #
            # No database and no ffmpeg: the repository is a local stand-in,
            # and the real constraint is proved by the MySQL job.
            from backend.src.service.recording_recovery import (
              RecordingRecoveryReconciler,
            )

            reconcile_root = Path(directory) / "reconcile-probe"
            (reconcile_root / "douyin" / "live").mkdir(parents=True)
            recovered_media = reconcile_root / "douyin" / "live" / "live.mp4"
            recovered_media.write_bytes(b"recovered-media-bytes")

            def reconcile_config():
              return {"download": {"save_path": str(reconcile_root)}}

            reconcile_journal = RecordingRecoveryJournal(
              config_loader=reconcile_config
            )
            replay_key = "abcdef0123456789abcdef0123456789"
            replay_intent = RecordingPersistenceIntent(
              app_user_id=7,
              platform="douyin",
              room_id="112233",
              owner_user_id="owner-2",
              title="restart probe",
              protocol="hls",
              output_path="douyin/live/live.mp4",
              started_at=_dt(2026, 8, 30, 11, 0, 0),
              finished_at=_dt(2026, 8, 30, 12, 0, 0),
              source="task_api",
            )
            reconcile_journal.publish(replay_intent, replay_key)

            # Discovery, on a real directory descriptor over a real directory.
            found = reconcile_journal.scan_pending_keys()
            if found.keys != [replay_key] or found.truncated:
              raise SystemExit(
                "FAIL: the journal scanner did not discover the pending note"
              )

            replayed = []

            class _Repository:
              def record_prepared(self, intent, *, recovery_key=None):
                replayed.append((intent, recovery_key))
                return 4242

            summary = RecordingRecoveryReconciler(
              journal=reconcile_journal,
              recording_service=_Repository(),
              config_loader=reconcile_config,
            ).reconcile_once()

            if summary.recovered != 1 or summary.retained != 0:
              raise SystemExit(
                "FAIL: reconciliation did not recover the note: %r" % (summary,)
              )
            if replayed != [(replay_intent, replay_key)]:
              raise SystemExit(
                "FAIL: the replayed intent was not the journalled one"
              )
            if reconcile_journal.load(replay_key) is not None:
              raise SystemExit("FAIL: the recovered note was not acknowledged")

            # And the gate really gates. The same note, with its recording
            # deleted, must not reach the repository - and must survive.
            recovered_media.unlink()
            reconcile_journal.publish(replay_intent, replay_key)
            refused = []

            class _Refusing:
              def record_prepared(self, intent, *, recovery_key=None):
                refused.append(recovery_key)
                return 1

            gated = RecordingRecoveryReconciler(
              journal=reconcile_journal,
              recording_service=_Refusing(),
              config_loader=reconcile_config,
            ).reconcile_once()
            if refused or gated.missing != 1:
              raise SystemExit(
                "FAIL: the media gate did not refuse a missing recording"
              )
            if reconcile_journal.load(replay_key) is None:
              raise SystemExit("FAIL: a refused note must be retained")
            print("ok   runtime recording recovery restart reconciliation")

            # Phase 13C P1-04: a canonical-looking FIFO with no writer must be
            # refused by the real journal load path before it can hold startup.
            # This is a real named pipe and real open/fstat on the container's
            # kernel; no filesystem syscall is mocked.
            import os as _os
            import stat as _stat
            from backend.src.service.recording_recovery_journal import (
              RecordingJournalUnavailable,
            )

            def _load_fifo_in_child(root, key, connection):
              import time
              child_journal = RecordingRecoveryJournal(
                config_loader=lambda: {
                  "download": {"save_path": str(root)}
                }
              )
              started = time.monotonic()
              try:
                child_journal.load(key)
              except RecordingJournalUnavailable:
                connection.send(("refused", time.monotonic() - started))
              except BaseException as error:
                connection.send((type(error).__name__, time.monotonic() - started))
              else:
                connection.send(("accepted", time.monotonic() - started))
              finally:
                connection.close()

            fifo_root = Path(directory) / "fifo-journal-probe"
            fifo_root.mkdir()
            fifo_journal = RecordingRecoveryJournal(
              config_loader=lambda: {
                "download": {"save_path": str(fifo_root)}
              }
            )
            fifo_key = "11111111111111111111111111111111"
            fifo_note = fifo_journal.ensure_root() / (fifo_key + ".json")
            _os.mkfifo(fifo_note)
            fifo_context = multiprocessing.get_context("fork")
            fifo_parent, fifo_child = fifo_context.Pipe(duplex=False)
            fifo_process = fifo_context.Process(
              target=_load_fifo_in_child,
              args=(fifo_root, fifo_key, fifo_child),
            )
            fifo_process.start()
            fifo_child.close()
            fifo_process.join(timeout=2.0)
            fifo_hung = fifo_process.is_alive()
            if fifo_hung:
              fifo_process.terminate()
              fifo_process.join(timeout=5.0)
            if fifo_process.is_alive():
              fifo_process.kill()
              fifo_process.join(timeout=5.0)
            if fifo_hung:
              raise SystemExit("FAIL: canonical recovery FIFO blocked startup")
            if not fifo_parent.poll(0.5):
              raise SystemExit("FAIL: canonical recovery FIFO returned no result")
            fifo_outcome, fifo_elapsed = fifo_parent.recv()
            fifo_parent.close()
            if fifo_outcome != "refused":
              raise SystemExit(
                "FAIL: canonical recovery FIFO outcome was " + fifo_outcome
              )
            if fifo_elapsed >= 2.0:
              raise SystemExit(
                "FAIL: canonical recovery FIFO refusal blocked for %.3fs"
                % fifo_elapsed
              )
            if not _stat.S_ISFIFO(_os.lstat(fifo_note).st_mode):
              raise SystemExit("FAIL: refused recovery FIFO was modified")
            print("ok   runtime recovery journal nonblocking FIFO refusal")

            # Phase 13C P1-05: real directory enumeration, cursor publication,
            # and deterministic rotation. Nothing in the first batch is
            # acknowledged, so the second scan proves retained-prefix fairness.
            fair_root = Path(directory) / "fair-journal-probe"
            fair_root.mkdir()
            fair_journal = RecordingRecoveryJournal(
              config_loader=lambda: {
                "download": {"save_path": str(fair_root)}
              }
            )
            fair_keys = ["%032x" % value for value in range(1, 6)]
            for fair_key in fair_keys:
              fair_journal.publish(probe_intent, fair_key)
            fair_first = fair_journal.scan_pending_keys(limit=2)
            fair_second = fair_journal.scan_pending_keys(limit=2)
            if fair_first.keys != fair_keys[:2]:
              raise SystemExit(
                "FAIL: fair recovery first batch differs: %r" % fair_first
              )
            if fair_second.keys != fair_keys[2:4]:
              raise SystemExit(
                "FAIL: retained recovery prefix monopolized next scan: %r"
                % fair_second
              )
            for retained_key in fair_keys[:2]:
              if fair_journal.load(retained_key) is None:
                raise SystemExit("FAIL: fair scan modified a retained note")
            fair_cursor = fair_journal.root() / ".scan-cursor"
            if fair_cursor.read_text(encoding="ascii") != fair_keys[3] + "\n":
              raise SystemExit("FAIL: fair scan cursor did not advance")
            print("ok   runtime recovery journal fair bounded scan")

            result = normalizer.normalize(source)

            if result != source.with_suffix(".mp4") or not result.is_file():
              raise SystemExit("FAIL: normalization did not publish an MP4")
            if source.exists():
              raise SystemExit("FAIL: the source TS survived a successful remux")
            # The container changed; the codecs did not. A re-encode here would
            # be a different feature with different costs.
            if codecs(result, "v:0") != {"h264"} or codecs(result, "a:0") != {"aac"}:
              raise SystemExit("FAIL: the remux re-encoded the recording")
            leftovers = [p.name for p in result.parent.iterdir() if "remux" in p.name]
            if leftovers:
              raise SystemExit("FAIL: remux temporaries left behind: %s" % leftovers)
          print("ok   runtime ffmpeg TS->MP4 normalization (stream copy)")
          PY
          docker cp /tmp/remux-smoke.py smsd-ci-smoke:/tmp/remux-smoke.py
          docker exec smsd-ci-smoke python /tmp/remux-smoke.py \
            > /tmp/remux-smoke.txt 2>&1 || {
              cat /tmp/remux-smoke.txt
              echo "FAIL: the runtime remux smoke did not complete"
              exit 1
            }
          cat /tmp/remux-smoke.txt
          # A smoke that printed nothing did not run. Exit status alone cannot
          # tell the difference between "proved it" and "silently did nothing".
          grep -q 'ok   runtime ffmpeg TS->MP4 normalization' /tmp/remux-smoke.txt || {
            echo "FAIL: the runtime remux smoke produced no result - it did not run"
            exit 1
          }
          grep -q 'ok   runtime file+directory fsync' /tmp/remux-smoke.txt || {
            echo "FAIL: the runtime durability primitives did not run"
            exit 1
          }
          grep -q 'ok   runtime HLS capture durability finalization' /tmp/remux-smoke.txt || {
            echo "FAIL: the runtime capture finalization proof did not run"
            exit 1
          }
          grep -q 'ok   runtime FLV capture durability finalization' /tmp/remux-smoke.txt || {
            echo "FAIL: the runtime FLV durability proof did not run"
            exit 1
          }
          grep -q 'ok   runtime recording recovery journal durability' /tmp/remux-smoke.txt || {
            echo "FAIL: the runtime recovery journal proof did not run"
            exit 1
          }
          grep -q 'ok   runtime recording recovery restart reconciliation' /tmp/remux-smoke.txt || {
            echo "FAIL: the runtime recovery reconciliation proof did not run"
            exit 1
          }
          grep -Fxq 'ok   runtime recovery journal nonblocking FIFO refusal' /tmp/remux-smoke.txt || {
            echo "FAIL: the runtime recovery FIFO refusal proof did not run"
            exit 1
          }
          grep -Fxq 'ok   runtime recovery journal fair bounded scan' /tmp/remux-smoke.txt || {
            echo "FAIL: the runtime recovery fair bounded scan proof did not run"
            exit 1
          }

          # Phase 15B: execute the tracked proof inside the production image.
          # It uses real Python locks and concurrent creators; no network,
          # database or platform credentials are involved.
          docker cp scripts/runtime_work_admission_probe.py \
            smsd-ci-smoke:/tmp/runtime_work_admission_probe.py
          docker exec smsd-ci-smoke \
            python /tmp/runtime_work_admission_probe.py \
            | tee /tmp/work-admission-smoke.txt
          grep -Fxq 'ok   runtime bounded work admission' \
            /tmp/work-admission-smoke.txt || {
              echo "FAIL: bounded work admission runtime marker was absent"
              exit 1
            }

      # Keep this separate from the direct docker-run smoke above. It proves
      # the checked-in deployment topology, including its real MySQL image,
      # secret boundary, internal network and named log volume.
      - name: Secure Compose deployment baseline
        run: |
          set -euo pipefail
          PROJECT=smsd-ci-compose
          export SMSD_IMAGE=smsd:ci

          cleanup() {
            echo "::group::compose logs"
            ./run-docker.sh -p "${PROJECT}" logs --no-color 2>&1 || true
            echo "::endgroup::"
            ./run-docker.sh -p "${PROJECT}" down -v --remove-orphans \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          mkdir -p config /tmp/smsd-compose-smoke
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
            Path("docs/design/config.yml.example").read_text(encoding="utf-8")
          )
          config["database"].update({
            "enable": True,
            "host": "mysql",
            "port": 3306,
            "name": "smsd_compose_ci",
            "username": "smsd_compose_app",
            "password": "compose-application-password",
          })
          config["download"]["test_mode"] = True
          config["download"]["save_response"] = False
          config["download"]["save_error_response"] = False
          config["download"]["save_path"] = "/app/downloads"
          config["log"].update({
            "log_enable": True,
            "log_level": "INFO",
            "log_save": True,
            "log_file_path": "/app/logs/server.log",
          })
          config["server"].update({
            "host": "127.0.0.1",
            "port": 5013,
            "debug_mode": False,
          })
          target = Path("config/config.yml")
          target.write_text(
            yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
            encoding="utf-8",
          )
          target.chmod(0o600)
          PY

          ./run-docker.sh -p "${PROJECT}" up -d --no-build
          test "$(stat -c '%a' config/mysql-root-password)" = "600" || {
            echo "FAIL: generated MySQL root secret is not mode 0600"
            exit 1
          }
          ROOT_SECRET_FINGERPRINT="$(sha256sum config/mysql-root-password)"
          MYSQL_ID="$(./run-docker.sh -p "${PROJECT}" ps -q mysql)"
          APP_ID="$(./run-docker.sh -p "${PROJECT}" ps -q app)"
          test -n "${MYSQL_ID}" && test -n "${APP_ID}"
          test "${ROOT_SECRET_FINGERPRINT}" = \
            "$(sha256sum config/mysql-root-password)" || {
              echo "FAIL: MySQL root secret was regenerated"
              exit 1
            }

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5013/ >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = "90" ]; then
              echo "FAIL: Compose application never became ready"
              exit 1
            fi
            sleep 1
          done

          docker port "${APP_ID}" 5013/tcp | grep -Fxq '127.0.0.1:5013' || {
            echo "FAIL: application port is not host-loopback-only"
            exit 1
          }
          if docker port "${MYSQL_ID}" 3306/tcp 2>/dev/null | grep -q .; then
            echo "FAIL: MySQL has a published host port"
            exit 1
          fi
          curl -fsS -D /tmp/smsd-compose-smoke/headers.txt \
            -o /dev/null http://127.0.0.1:5013/
          grep -qiE '^server: waitress([[:space:]]|$)' \
            /tmp/smsd-compose-smoke/headers.txt || {
              echo "FAIL: Compose HTTP was not served by Waitress"
              exit 1
            }

          cat > /tmp/smsd-compose-smoke/mysql-proof.sh <<'SH'
          #!/bin/sh
          set -eu
          root_password="$(cat /run/secrets/mysql_root_password)"
          MYSQL_PWD="${root_password}" mysql -h 127.0.0.1 -uroot \
            -e 'SELECT 1' >/dev/null
          MYSQL_PWD="${MYSQL_PASSWORD}" mysql -h 127.0.0.1 \
            -u"${MYSQL_USER}" "${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null
          if MYSQL_PWD="${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -uroot \
            -e 'SELECT 1' >/dev/null 2>&1; then
            echo 'FAIL: application password authenticated as root'
            exit 1
          fi
          SH
          chmod 700 /tmp/smsd-compose-smoke/mysql-proof.sh
          docker cp /tmp/smsd-compose-smoke/mysql-proof.sh \
            "${MYSQL_ID}:/tmp/mysql-proof.sh"
          docker exec "${MYSQL_ID}" /tmp/mysql-proof.sh

          cat > /tmp/smsd-compose-smoke/app-proof.py <<'PY'
          import os
          import pwd
          import socket
          import sys
          from pathlib import Path

          if os.getuid() == 0 or pwd.getpwuid(os.getuid()).pw_name != "appuser":
            raise SystemExit("FAIL: application proof is not running as appuser")
          forbidden_environment = {
            "MYSQL_ROOT_PASSWORD",
            "MYSQL_ROOT_PASSWORD_FILE",
            "SMSD_MYSQL_ROOT_SECRET_FILE",
          }
          if forbidden_environment.intersection(os.environ):
            raise SystemExit("FAIL: application received MySQL root secret metadata")
          if Path("/run/secrets/mysql_root_password").exists():
            raise SystemExit("FAIL: application received the MySQL root secret")
          with socket.create_connection(("mysql", 3306), timeout=5):
            pass

          sys.path.insert(0, "/app")
          from backend.src.base.log import LoggerManager
          logger = LoggerManager.get_instance().get_logger()
          marker = "secure-compose-file-log-proof"
          logger.warning(marker)
          for handler in logger.handlers:
            handler.flush()
          log_path = Path("/app/logs/server.log")
          if marker not in log_path.read_text(encoding="utf-8"):
            raise SystemExit("FAIL: configured file logging did not write")
          PY
          docker cp /tmp/smsd-compose-smoke/app-proof.py \
            "${APP_ID}:/tmp/app-proof.py"
          docker exec --user appuser "${APP_ID}" python /tmp/app-proof.py

          ./run-docker.sh -p "${PROJECT}" up -d --no-deps \
            --force-recreate --no-build app
          APP_ID="$(./run-docker.sh -p "${PROJECT}" ps -q app)"
          for attempt in $(seq 1 60); do
            if docker exec --user appuser "${APP_ID}" \
              grep -q 'secure-compose-file-log-proof' /app/logs/server.log; then
              break
            fi
            if [ "${attempt}" = "60" ]; then
              echo "FAIL: named-volume log did not survive app recreation"
              exit 1
            fi
            sleep 1
          done

          echo 'ok   runtime secure compose deployment baseline' \
            > /tmp/smsd-compose-smoke/result.txt
          cat /tmp/smsd-compose-smoke/result.txt
          grep -Fxq 'ok   runtime secure compose deployment baseline' \
            /tmp/smsd-compose-smoke/result.txt || {
              echo "FAIL: secure Compose runtime marker was absent"
              exit 1
            }

      - name: Release backup and restore drill
        run: |
          set -euo pipefail
          export SMSD_IMAGE=smsd:ci
          SOURCE_PROJECT=smsd-ci-release-source
          RESTORE_PROJECT=smsd-restore-test-ci-run
          BACKUP_DIR="$(mktemp -d /tmp/smsd-release-backup.XXXXXX)"
          cleanup_release_drill() {
            rm -rf -- "${BACKUP_DIR}"
            rm -f -- config/config.yml config/mysql-root-password
          }
          trap cleanup_release_drill EXIT
          rm -f -- config/config.yml config/mysql-root-password

          python - <<'PY'
          from pathlib import Path
          import secrets
          import yaml

          config = yaml.safe_load(
            Path("docs/design/config.yml.example").read_text(encoding="utf-8")
          )
          config["database"].update({
            "enable": True,
            "host": "mysql",
            "port": 3306,
            "name": "smsd_release_ci",
            "username": "smsd_release_app",
            "password": secrets.token_urlsafe(32),
          })
          config["download"].update({
            "test_mode": True,
            "save_response": False,
            "save_error_response": False,
            "save_path": "/app/downloads",
          })
          config["log"].update({
            "log_enable": True,
            "log_level": "INFO",
            "log_save": True,
            "log_file_path": "/app/logs/server.log",
          })
          config["server"].update({
            "host": "127.0.0.1",
            "port": 5014,
            "debug_mode": False,
          })
          target = Path("config/config.yml")
          target.write_text(
            yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
            encoding="utf-8",
          )
          target.chmod(0o600)
          PY

          bash scripts/release_restore_drill.sh \
            --source-project "${SOURCE_PROJECT}" \
            --restore-project "${RESTORE_PROJECT}" \
            --backup "${BACKUP_DIR}" \
            --health-url http://127.0.0.1:5014/ \
            | tee /tmp/smsd-release-restore-drill.txt
          grep -Fxq 'ok   runtime release backup restore drill' \
            /tmp/smsd-release-restore-drill.txt || {
              echo "FAIL: release backup/restore runtime marker was absent"
              exit 1
            }
