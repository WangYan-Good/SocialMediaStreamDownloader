name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # config/config.yml holds real credentials and is deliberately untracked,
      # but parts of the unit suite reach code that loads it - a downloader
      # built through the legacy dispatch path, for one - and swallow the
      # failure, which shows up as a test asserting that work was submitted
      # when none was. Every developer machine has the file, so this only
      # surfaced once the suite first ran on a clean checkout.
      #
      # Materialised from the tracked example and hardened exactly the way
      # backend/src/unit_test/config_fixture.py hardens it, so CI runs against
      # the same settings the fixture already considers safe: no database, no
      # real transfers, no files written into the workspace.
      - name: Provide a test configuration
        run: |
          mkdir -p config
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
            Path("docs/design/config.yml.example").read_text(encoding="utf-8")
          )
          config["database"]["enable"] = False
          config["download"]["test_mode"] = True
          config["download"]["save_response"] = False
          config["download"]["save_error_response"] = False
          # Outside the workspace, so a stray write cannot masquerade as a
          # source file or reach the artefact upload.
          config["download"]["save_path"] = "/tmp/smsd-ci-downloads/"
          config["log"]["log_save"] = False
          config["server"]["debug_mode"] = False

          Path("config/config.yml").write_text(
            yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
            encoding="utf-8",
          )
          PY

      # The unit suite only. backend/src/integration_test talks to a real
      # database and is deliberately not part of this job.
      - name: Run unit tests
        run: python -m pytest backend/src/unit_test -q

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4

      # Node 24, matching frontend/app/package.json engines and the Dockerfile
      # builder stage. One major across all three, so a lockfile resolved in one
      # place installs the same way in the others.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      # npm ci, never npm install: the lockfile is the contract, and resolving
      # versions afresh in CI is how a green build stops matching the one that
      # ships.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  image:
    name: Docker build and runtime smoke
    runs-on: ubuntu-latest
    # Only once both halves pass: the image contains both, so building it before
    # either is verified would only ever fail slower.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t smsd:ci .

      # A build that passes proves the image assembles, and nothing about
      # whether it starts. It did not, for a while: the entrypoint validates the
      # mounted configuration against docs/design/config.yml.example before
      # staging it, and .dockerignore excluded docs/ - so every build was green
      # and every container exited immediately. Only running it finds that.
      - name: Generate a safe smoke configuration
        run: |
          mkdir -p /tmp/smsd-smoke
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
            Path("docs/design/config.yml.example").read_text(encoding="utf-8")
          )
          # No database, no real transfers, nothing written into the workspace.
          # The smoke proves the image starts and serves; it must never need a
          # credential, a database or the platform.
          config["database"]["enable"] = False
          config["download"]["test_mode"] = True
          config["download"]["save_response"] = False
          config["download"]["save_error_response"] = False
          config["download"]["save_path"] = "/tmp/smsd-smoke-downloads/"
          config["log"]["log_save"] = False
          config["server"]["debug_mode"] = False
          config["server"]["host"] = "0.0.0.0"

          Path("/tmp/smsd-smoke/config.yml").write_text(
            yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
            encoding="utf-8",
          )
          PY

      - name: Runtime smoke
        run: |
          set -euo pipefail

          # Logs on the way out, whatever happened, and always remove the
          # container - a failed smoke must not leave one behind or wedge the
          # job.
          cleanup() {
            echo "::group::container logs"
            docker logs smsd-ci-smoke 2>&1 || true
            echo "::endgroup::"
            docker rm -f smsd-ci-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Docker picks the host port. A fixed one collides with whatever else
          # a runner happens to be holding.
          docker run -d --name smsd-ci-smoke \
            -p 127.0.0.1::5000 \
            -v /tmp/smsd-smoke/config.yml:/run/secrets/config.yml:ro \
            smsd:ci

          PORT="$(docker port smsd-ci-smoke 5000/tcp | head -1 | sed 's/.*://')"
          BASE="http://127.0.0.1:${PORT}"
          echo "smoke base: ${BASE}"

          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/" || true)" = "200" ]; then
              echo "ready after ${attempt}s"
              break
            fi
            if [ "${attempt}" = "60" ]; then
              echo "container never became ready"
              exit 1
            fi
            sleep 1
          done

          expect() {
            code="$(curl -s -o /dev/null -w '%{http_code}' "${BASE}$1")"
            if [ "${code}" != "$2" ]; then
              echo "FAIL $1 -> ${code}, expected $2"
              exit 1
            fi
            echo "ok   $1 -> ${code}"
          }

          expect_redirect() {
            path="$1"
            target="$2"
            headers="/tmp/smsd-smoke/redirect-headers.txt"
            code="$(curl -s -o /dev/null -D "${headers}" -w '%{http_code}' "${BASE}${path}")"
            location="$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "${headers}")"
            if [ "${code}" != "302" ] || [ "${location}" != "${target}" ]; then
              echo "FAIL ${path} -> ${code} Location=${location}, expected 302 ${target}"
              exit 1
            fi
            echo "ok   ${path} -> 302 ${location}"
          }

          expect_not_vue() {
            path="$1"
            expect "${path}" 404
            if curl -s "${BASE}${path}" | grep -q '<div id="app">'; then
              echo "FAIL ${path} was swallowed by the Vue shell"
              exit 1
            fi
          }

          # Vue owns root, and the emitted document must agree with the Flask
          # root asset mount rather than carrying the retired /app/ base.
          expect / 200
          curl -fsS "${BASE}/" > /tmp/smsd-smoke/root.html
          grep -q '<div id="app">' /tmp/smsd-smoke/root.html \
            || { echo "FAIL / is not the Vue shell"; exit 1; }
          if grep -q 'sidebar-menu-text\|/app/assets/' /tmp/smsd-smoke/root.html; then
            echo "FAIL / contains Legacy markup or the old asset base"
            exit 1
          fi

          # Every deep link returns the shell, so a refresh inside the
          # application does not 404.
          for path in overview new creators library tasks system; do
            expect "/${path}" 200
            curl -s "${BASE}/${path}" | grep -q '<div id="app">' \
              || { echo "FAIL /${path} is not the Vue shell"; exit 1; }
          done

          # Fetch a real emitted script. Root html alone can be healthy while
          # its base or Flask asset mount is broken.
          ASSET_PATH="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/smsd-smoke/root.html | head -1 | cut -d '"' -f 2)"
          test -n "${ASSET_PATH}" || { echo "FAIL no root JS asset found"; exit 1; }
          curl -fsS -D /tmp/smsd-smoke/asset-headers.txt \
            -o /tmp/smsd-smoke/app.js "${BASE}${ASSET_PATH}"
          grep -qiE '^content-type: (application|text)/javascript' /tmp/smsd-smoke/asset-headers.txt \
            || { echo "FAIL ${ASSET_PATH} is not JavaScript"; exit 1; }

          # Legacy is explicit and independently usable, including its static
          # files and unchanged root POST compatibility endpoint.
          for path in /legacy /legacy/; do
            expect "${path}" 200
            curl -s "${BASE}${path}" > /tmp/smsd-smoke/legacy.html
            grep -q 'sidebar-menu-text' /tmp/smsd-smoke/legacy.html \
              || { echo "FAIL ${path} is not Legacy"; exit 1; }
            if grep -q '<div id="app">' /tmp/smsd-smoke/legacy.html; then
              echo "FAIL ${path} returned the Vue shell"
              exit 1
            fi
          done
          expect /static/js/submit.js 200
          code="$(curl -s -o /tmp/smsd-smoke/post.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{}' "${BASE}/")"
          test "${code}" = "400" || { echo "FAIL POST / -> ${code}"; exit 1; }

          # Old bookmarks remain reversible temporary redirects. Query text is
          # preserved, and doubled slashes cannot create an external Location.
          expect_redirect /app /
          expect_redirect /app/ /
          expect_redirect /app/tasks /tasks
          expect_redirect '/app/tasks?state=running' '/tasks?state=running'
          expect_redirect "/app${ASSET_PATH}" "${ASSET_PATH}"
          expect_redirect /app//evil.example/path /evil.example/path

          # A missing asset must 404 rather than fall back to index.html -
          # otherwise a broken bundle reference silently returns html and the
          # failure surfaces as a syntax error in the browser.
          expect /assets/definitely-does-not-exist.js 404

          expect_not_vue /api/definitely-does-not-exist
          expect_not_vue /legacy/definitely-does-not-exist
          expect_not_vue /static/definitely-does-not-exist.css

          expect "/api/tasks?limit=1" 200

          # The status endpoint answers even with persistence switched off, and
          # says so rather than pretending the schema is fine.
          curl -s "${BASE}/api/system/status" > /tmp/smsd-smoke/status.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/smsd-smoke/status.json").read_text())
          assert payload["status"] == "success", payload
          assert payload["data"]["database"]["state"] == "disabled", payload
          print("ok   /api/system/status -> success, database disabled")
          PY
