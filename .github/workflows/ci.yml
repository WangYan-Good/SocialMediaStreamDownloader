name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate Python and Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall server.py backend

      - name: Validate YAML configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          excluded = {Path("config/douyin/live_response.yml")}
          paths = [
              *[p for p in Path("config").rglob("*.yml") if p not in excluded],
              *Path(".github").rglob("*.yml"),
          ]
          for path in paths:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"ok: {path}")
          PY

      - name: Run pytest if tests are collected
        run: |
          python -m pip install pytest
          set +e
          python -m pytest backend/src/unit_test -q
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "No pytest tests collected; compile and security checks still ran."
            exit 0
          fi
          exit "$status"

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit pip-audit

      - name: Static security analysis
        run: bandit -r server.py backend -x backend/src/unit_test -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - validate
      - security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_PASSWORD: ci_app_password
          SMSD_DB_PASSWORD: ci_app_password
        run: docker compose config

      - name: Build image
        run: docker build --pull --tag smsd:${{ github.sha }} .

  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
