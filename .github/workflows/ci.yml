name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # config/config.yml holds real credentials and is deliberately untracked.
      # A few service-level tests still exercise configuration-backed modern
      # task execution, so CI materialises the tracked safe example.
      # Materialised from the tracked example and hardened exactly the way
      # backend/src/unit_test/config_fixture.py hardens it, so CI runs against
      # the same settings the fixture already considers safe: no database, no
      # real transfers, no files written into the workspace.
      - name: Provide a test configuration
        run: |
          mkdir -p config
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
            Path("docs/design/config.yml.example").read_text(encoding="utf-8")
          )
          config["database"]["enable"] = False
          config["download"]["test_mode"] = True
          config["download"]["save_response"] = False
          config["download"]["save_error_response"] = False
          # Outside the workspace, so a stray write cannot masquerade as a
          # source file or reach the artefact upload.
          config["download"]["save_path"] = "/tmp/smsd-ci-downloads/"
          config["log"]["log_save"] = False
          config["server"]["debug_mode"] = False

          Path("config/config.yml").write_text(
            yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
            encoding="utf-8",
          )
          PY

      # The unit suite only. backend/src/integration_test talks to a real
      # database and is deliberately not part of this job.
      - name: Run unit tests
        run: python -m pytest backend/src/unit_test -q

  # The schema proof, kept apart from the unit job on purpose.
  #
  # Everything this exercises is MySQL-specific and cannot be checked any other
  # way: generated columns and their unique constraints, real foreign-key
  # actions, auto-increment identities, and upgrade/downgrade behaviour. A fake
  # cursor cannot disagree with invalid DDL and SQLite would enforce different
  # rules, so neither is evidence.
  #
  # Separate rather than folded into `backend` so the ordinary unit suite stays
  # offline and fast: nobody should need a database to run it, and it still
  # holds the constraint's *shape* through source-level tests.
  mysql:
    name: MySQL schema and migrations
    runs-on: ubuntu-latest
    # Reads the checkout and nothing else.
    permissions:
      contents: read
    services:
      mysql:
        # The version docker-compose already pins. Not `latest`, and not
        # MariaDB: the collation this schema uses is 8.0-only, and the
        # generated-column behaviour being proved is MySQL's.
        image: mysql:8.0
        env:
          # Test-only, and only ever reachable from this job's own service
          # container. Nothing here is a repository secret and nothing here
          # touches a real database.
          MYSQL_ROOT_PASSWORD: smsd_test
          MYSQL_DATABASE: smsd_test
        ports:
          - 3306:3306
        # The tests create and drop their own disposable databases, so the job
        # must not start until the server genuinely answers. A fixed sleep is
        # the usual way this becomes flaky on a slow runner.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psmsd_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No config/config.yml is materialised here, and none is needed: these
      # tests build their connection from the DSN below rather than from the
      # loaded configuration.
      #
      # SMSD_REQUIRE_MYSQL_TESTS is the point of this step. Without it a missing
      # or unusable database would answer with a green job full of skips - a
      # proof that quietly stopped happening, which is exactly the failure this
      # job exists to prevent. With it, that is a hard failure.
      - name: Run the MySQL schema and migration tests
        env:
          SMSD_TEST_MYSQL_DSN: mysql+pymysql://root:smsd_test@127.0.0.1:3306
          SMSD_REQUIRE_MYSQL_TESTS: '1'
        run: |
          python -m pytest \
            backend/src/unit_test/test_person_main_constraint_mysql.py \
            backend/src/unit_test/test_auth_migration_mysql.py \
            backend/src/unit_test/test_post_ownership_migration_mysql.py \
            backend/src/unit_test/test_recording_resource_migration_mysql.py \
            backend/src/unit_test/test_rbac_role_migration_mysql.py \
            -q -rs

      # Belt and braces. The flag above already turns a missing DSN into a
      # collection error, but a future edit could reintroduce a skip some other
      # way - a decorator, a marker, an environment check - and a skipped proof
      # reads exactly like a passing one in the summary.
      - name: Refuse a run that skipped anything
        env:
          SMSD_TEST_MYSQL_DSN: mysql+pymysql://root:smsd_test@127.0.0.1:3306
          SMSD_REQUIRE_MYSQL_TESTS: '1'
        run: |
          set -euo pipefail
          python -m pytest \
            backend/src/unit_test/test_person_main_constraint_mysql.py \
            backend/src/unit_test/test_auth_migration_mysql.py \
            backend/src/unit_test/test_post_ownership_migration_mysql.py \
            backend/src/unit_test/test_recording_resource_migration_mysql.py \
            backend/src/unit_test/test_rbac_role_migration_mysql.py \
            -q -rs --no-header > /tmp/mysql-tests.txt 2>&1 || {
              cat /tmp/mysql-tests.txt
              exit 1
            }
          cat /tmp/mysql-tests.txt
          if grep -qE '[0-9]+ skipped' /tmp/mysql-tests.txt; then
            echo "FAIL: the MySQL schema tests skipped - they must actually run here"
            exit 1
          fi
          grep -qE '[0-9]+ passed' /tmp/mysql-tests.txt || {
            echo "FAIL: no tests ran"
            exit 1
          }

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/app
    steps:
      - uses: actions/checkout@v4

      # Node 24, matching frontend/app/package.json engines and the Dockerfile
      # builder stage. One major across all three, so a lockfile resolved in one
      # place installs the same way in the others.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      # npm ci, never npm install: the lockfile is the contract, and resolving
      # versions afresh in CI is how a green build stops matching the one that
      # ships.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  image:
    name: Docker build and runtime smoke
    runs-on: ubuntu-latest
    # Only once both halves pass: the image contains both, so building it before
    # either is verified would only ever fail slower.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t smsd:ci .

      # A build that passes proves the image assembles, and nothing about
      # whether it starts. It did not, for a while: the entrypoint validates the
      # mounted configuration against docs/design/config.yml.example before
      # staging it, and .dockerignore excluded docs/ - so every build was green
      # and every container exited immediately. Only running it finds that.
      - name: Generate a safe smoke configuration
        run: |
          mkdir -p /tmp/smsd-smoke
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(
            Path("docs/design/config.yml.example").read_text(encoding="utf-8")
          )
          # No database, no real transfers, nothing written into the workspace.
          # The smoke proves the image starts and serves; it must never need a
          # credential, a database or the platform.
          config["database"]["enable"] = False
          config["download"]["test_mode"] = True
          config["download"]["save_response"] = False
          config["download"]["save_error_response"] = False
          config["download"]["save_path"] = "/tmp/smsd-smoke-downloads/"
          config["log"]["log_save"] = False
          config["server"]["debug_mode"] = False
          config["server"]["host"] = "0.0.0.0"

          Path("/tmp/smsd-smoke/config.yml").write_text(
            yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
            encoding="utf-8",
          )
          PY

      - name: Runtime smoke
        run: |
          set -euo pipefail

          # Logs on the way out, whatever happened, and always remove the
          # container - a failed smoke must not leave one behind or wedge the
          # job.
          cleanup() {
            echo "::group::container logs"
            docker logs smsd-ci-smoke 2>&1 || true
            echo "::endgroup::"
            docker rm -f smsd-ci-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Docker picks the host port. A fixed one collides with whatever else
          # a runner happens to be holding.
          docker run -d --name smsd-ci-smoke \
            -p 127.0.0.1::5000 \
            -v /tmp/smsd-smoke/config.yml:/run/secrets/config.yml:ro \
            smsd:ci

          PORT="$(docker port smsd-ci-smoke 5000/tcp | head -1 | sed 's/.*://')"
          BASE="http://127.0.0.1:${PORT}"
          echo "smoke base: ${BASE}"

          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "${BASE}/" || true)" = "200" ]; then
              echo "ready after ${attempt}s"
              break
            fi
            if [ "${attempt}" = "60" ]; then
              echo "container never became ready"
              exit 1
            fi
            sleep 1
          done

          expect() {
            code="$(curl -s -o /dev/null -w '%{http_code}' "${BASE}$1")"
            if [ "${code}" != "$2" ]; then
              echo "FAIL $1 -> ${code}, expected $2"
              exit 1
            fi
            echo "ok   $1 -> ${code}"
          }

          expect_redirect() {
            path="$1"
            target="$2"
            headers="/tmp/smsd-smoke/redirect-headers.txt"
            code="$(curl -s -o /dev/null -D "${headers}" -w '%{http_code}' "${BASE}${path}")"
            location="$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2; exit }' "${headers}")"
            if [ "${code}" != "302" ] || [ "${location}" != "${target}" ]; then
              echo "FAIL ${path} -> ${code} Location=${location}, expected 302 ${target}"
              exit 1
            fi
            echo "ok   ${path} -> 302 ${location}"
          }

          expect_not_vue() {
            path="$1"
            expect "${path}" 404
            if curl -s "${BASE}${path}" | grep -q '<div id="app">'; then
              echo "FAIL ${path} was swallowed by the Vue shell"
              exit 1
            fi
          }

          # Vue owns root, and the emitted document must agree with the Flask
          # root asset mount rather than carrying the retired /app/ base.
          expect / 200
          curl -fsS "${BASE}/" > /tmp/smsd-smoke/root.html
          grep -q '<div id="app">' /tmp/smsd-smoke/root.html \
            || { echo "FAIL / is not the Vue shell"; exit 1; }
          if grep -q 'sidebar-menu-text\|/app/assets/' /tmp/smsd-smoke/root.html; then
            echo "FAIL / contains Legacy markup or the old asset base"
            exit 1
          fi

          # Every deep link returns the shell, so a refresh inside the
          # application does not 404.
          #
          # Both consoles, and the legacy paths still promised. The admin ones
          # matter for the same reason as the rest and were the ones missing:
          # Flask has never heard of any of these, so a prefix accidentally
          # becoming reserved - or the catch-all being narrowed - would 404 a
          # refresh in production while every unit test stayed green.
          #
          # /admin is in this list, not in the redirect list below it. It
          # redirects to /admin/creators in the *router*, once the shell has
          # loaded; Flask must answer it with the shell like any other
          # client-side route.
          for path in new library tasks login forbidden auth-unavailable \
                      admin admin/creators admin/library admin/tasks admin/system \
                      overview creators system; do
            expect "/${path}" 200
            curl -s "${BASE}/${path}" | grep -q '<div id="app">' \
              || { echo "FAIL /${path} is not the Vue shell"; exit 1; }
          done

          # Fetch a real emitted script. Root html alone can be healthy while
          # its base or Flask asset mount is broken.
          ASSET_PATH="$(grep -oE 'src="/assets/[^"]+\.js"' /tmp/smsd-smoke/root.html | head -1 | cut -d '"' -f 2)"
          test -n "${ASSET_PATH}" || { echo "FAIL no root JS asset found"; exit 1; }
          curl -fsS -D /tmp/smsd-smoke/asset-headers.txt \
            -o /tmp/smsd-smoke/app.js "${BASE}${ASSET_PATH}"
          grep -qiE '^content-type: (application|text)/javascript' /tmp/smsd-smoke/asset-headers.txt \
            || { echo "FAIL ${ASSET_PATH} is not JavaScript"; exit 1; }

          # P16 retires the public Legacy surface. These namespaces remain
          # tombstones so removing their old Flask routes cannot make the Vue
          # catch-all claim them.
          for path in /legacy /legacy/ /legacy/definitely-does-not-exist \
                      /static /static/ /static/js/submit.js \
                      /static/definitely-does-not-exist.css; do
            expect_not_vue "${path}"
          done

          # The old raw-url dispatcher trust boundary is gone. Flask naturally
          # reports method-not-allowed; there is no redirect/replacement route.
          code="$(curl -s -o /tmp/smsd-smoke/post.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{}' "${BASE}/")"
          test "${code}" = "405" || { echo "FAIL POST / -> ${code}, expected 405"; exit 1; }

          # Production retirement is an image property, not just a source-tree
          # grep. The runtime image must not contain the deleted Legacy UI or
          # its dispatcher modules.
          docker exec smsd-ci-smoke test ! -d /app/frontend/src
          docker exec smsd-ci-smoke test ! -e /app/backend/src/platform/platform_dispatcher.py
          docker exec smsd-ci-smoke test ! -e /app/backend/src/platform/douyin/douyin_handler.py
          docker exec smsd-ci-smoke test ! -e /app/backend/src/platform/other/other_handler.py

          # Old bookmarks remain reversible temporary redirects. Query text is
          # preserved, and doubled slashes cannot create an external Location.
          expect_redirect /app /
          expect_redirect /app/ /
          expect_redirect /app/tasks /tasks
          expect_redirect '/app/tasks?state=running' '/tasks?state=running'
          expect_redirect "/app${ASSET_PATH}" "${ASSET_PATH}"
          expect_redirect /app//evil.example/path /evil.example/path

          # A missing asset must 404 rather than fall back to index.html -
          # otherwise a broken bundle reference silently returns html and the
          # failure surfaces as a syntax error in the browser.
          expect /assets/definitely-does-not-exist.js 404

          expect_not_vue /api/definitely-does-not-exist
          expect "/api/auth/me" 401
          expect "/api/tasks?limit=1" 401
          expect "/api/system/status" 401

          # Media delivery is not a public file server. These are the only
          # endpoints in the application that return bytes from disk, so the
          # image itself has to prove they refuse an anonymous caller - a unit
          # test cannot notice a reverse proxy or a route ordering that let one
          # through in the built artifact.
          #
          # 401 rather than 404: the refusal happens at authentication, before
          # any lookup, so the answer cannot depend on whether the resource or
          # the file exists.
          expect "/api/library/posts/douyin/7657271784144009946/assets/$(printf 'a%.0s' $(seq 64))/download" 401
          expect "/api/library/recordings/7/assets/$(printf 'a%.0s' $(seq 64))/download" 401

          # And the metadata endpoints beside them, for the same reason.
          expect "/api/library/posts/douyin/7657271784144009946/assets" 401
          expect "/api/library/recordings/7/assets" 401

          # A Range header must not be a way around authentication. Phase 10C
          # added byte ranges to these same endpoints, and the refusal has to
          # happen before anything looks at a file - so a ranged request from
          # an anonymous caller answers exactly as an unranged one does.
          #
          # Serving an actual partial response here would mean seeding a user,
          # a row and a media fixture inside the smoke container; that is
          # covered by the route-level integration tests instead. What only the
          # built image can prove is that the header does not change who may
          # ask.
          expect_ranged() {
            code="$(curl -s -o /dev/null -H 'Range: bytes=0-3' \
              -w '%{http_code}' "${BASE}$1")"
            if [ "${code}" != "$2" ]; then
              echo "FAIL ranged $1 -> ${code}, expected $2"
              exit 1
            fi
            echo "ok   ranged $1 -> ${code}"
          }
          expect_ranged "/api/library/posts/douyin/7657271784144009946/assets/$(printf 'a%.0s' $(seq 64))/download" 401
          expect_ranged "/api/library/recordings/7/assets/$(printf 'a%.0s' $(seq 64))/download" 401

          # The media asset endpoints read the server's own filesystem, so the
          # first thing worth proving about them is that nobody unauthenticated
          # can reach one. No real volume file is involved: an anonymous request
          # is refused before any path is resolved.
          expect "/api/library/posts/douyin/test/assets" 401
          expect "/api/library/recordings/1/assets" 401
